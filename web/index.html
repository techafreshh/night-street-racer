<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night Street Racer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a12;
        color: #f2f2f2;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #ui .menu {
        pointer-events: auto;
        background: rgba(10, 10, 18, 0.85);
        border: 1px solid #333;
        border-radius: 8px;
        padding: 24px 32px;
        text-align: center;
      }
      #ui .menu h1 {
        margin: 0 0 16px;
        font-size: 28px;
        letter-spacing: 1px;
      }
      #ui .menu button {
        display: block;
        width: 220px;
        margin: 8px auto;
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
      }
      #ui .event-list {
        list-style: none;
        margin: 16px 0 0;
        padding: 0;
        font-size: 14px;
        color: #bbb;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        font-family: monospace;
        font-size: 14px;
        line-height: 1.5;
        color: #f2f2f2;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #hud[hidden] {
        display: none;
      }
      #hud-drift {
        color: #ffd75e;
        font-weight: bold;
      }
      #minimap {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        border: 1px solid #333;
        background: rgba(8, 10, 18, 0.72);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud" hidden style="display: none">
      <div id="hud-speed">0 km/h</div>
      <div id="hud-gear">N</div>
      <div id="hud-lap">1/1</div>
      <div id="hud-position">1/1</div>
      <div id="hud-timer">00:00.000</div>
      <div id="hud-delta">--:--.---</div>
      <div id="hud-drift" hidden style="display: none">DRIFT +0</div>
    </div>
    <canvas id="minimap" width="200" height="200"></canvas>
    <div id="ui">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
